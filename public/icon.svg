<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <style>
    :root {
      --bg: #e9e4d8;
      --card: #f4efe4;
      --fg: #1e1e1e;
      --border: #d2cbbb;
      --accent: #2e2e2e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141414;
        --card: #1c1c1c;
        --fg: #e8e3da;
        --border: #2c2c2c;
        --accent: #d1cfc0;
      }
    }
  </style>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="var(--bg)" />
  
  <!-- Outer card ring with border -->
  <rect x="40" y="40" width="432" height="432" rx="80" fill="var(--card)" stroke="var(--border)" stroke-width="6" />

  <!-- Center Microphone Icon matching Splash Screen -->
  <g transform="translate(256, 225)">
    <!-- Mic capsule -->
    <rect x="-38" y="-65" width="76" height="126" rx="38" fill="var(--fg)" />
    <!-- Stand arc -->
    <path d="M -64 10 A 64 64 0 0 0 64 10" fill="none" stroke="var(--fg)" stroke-width="16" stroke-linecap="round" />
    <!-- Vertical stem -->
    <line x1="0" y1="74" x2="0" y2="112" stroke="var(--fg)" stroke-width="16" stroke-linecap="round" />
    <!-- Base line -->
    <line x1="-38" y1="112" x2="38" y2="112" stroke="var(--fg)" stroke-width="16" stroke-linecap="round" />
  </g>

  <!-- Loading pulse dots matching Splash Screen -->
  <g transform="translate(256, 405)">
    <circle cx="-42" cy="0" r="10" fill="var(--accent)" />
    <circle cx="0" cy="0" r="13" fill="var(--accent)" />
    <circle cx="42" cy="0" r="10" fill="var(--accent)" />
  </g>
</svg>
