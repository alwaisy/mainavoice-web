<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer subtle ring -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#334155" stroke-width="4" opacity="0.6" />

  <!-- Center Microphone / Sound Waveform Visual -->
  <g transform="translate(256, 256)">
    <!-- Central Sound Waves (Symmetrical) -->
    <!-- Bar 1 -->
    <rect x="-140" y="-30" width="16" height="60" rx="8" fill="url(#waveGrad)" opacity="0.45" />
    <!-- Bar 2 -->
    <rect x="-105" y="-60" width="18" height="120" rx="9" fill="url(#waveGrad)" opacity="0.65" />
    <!-- Bar 3 -->
    <rect x="-70" y="-105" width="20" height="210" rx="10" fill="url(#waveGrad)" opacity="0.85" />
    <!-- Bar 4 (Center Left) -->
    <rect x="-35" y="-140" width="22" height="280" rx="11" fill="url(#waveGrad)" filter="url(#glow)" />
    <!-- Bar 5 (Center Right) -->
    <rect x="13" y="-140" width="22" height="280" rx="11" fill="url(#waveGrad)" filter="url(#glow)" />
    <!-- Bar 6 -->
    <rect x="50" y="-105" width="20" height="210" rx="10" fill="url(#waveGrad)" opacity="0.85" />
    <!-- Bar 7 -->
    <rect x="87" y="-60" width="18" height="120" rx="9" fill="url(#waveGrad)" opacity="0.65" />
    <!-- Bar 8 -->
    <rect x="124" y="-30" width="16" height="60" rx="8" fill="url(#waveGrad)" opacity="0.45" />

    <!-- Pulse dot -->
    <circle cx="0" cy="180" r="10" fill="#f59e0b" filter="url(#glow)" />
  </g>
</svg>
